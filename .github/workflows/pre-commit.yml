name: Pre-commit

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: [self-hosted, linux]
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
